<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48" role="img" aria-label="Cartoon TV icon" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .body    { fill: var(--primary-color, #14B8A6); }
    .screen  { fill: var(--background, #080C0B); }
    .lime    { fill: var(--accent-color, #D9FF66); }
    .limeS   { fill: none; stroke: var(--accent-color, #D9FF66); stroke-width: 2.6; stroke-linecap: round; }
    .shine   { fill: #fff; opacity: .2; }
    .knob    { fill: #fff; opacity: .85; }

    .tv      { transform-origin: 32px 56px; animation: bounce 2.4s ease-in-out infinite; }
    .antL    { transform-origin: 26px 18px; animation: wigL 1.6s ease-in-out infinite; }
    .antR    { transform-origin: 38px 18px; animation: wigR 1.6s ease-in-out infinite; }
    .eye     { transform-box: fill-box; transform-origin: center; animation: blink 3.2s infinite; }
    .scan    { fill: #fff; opacity: .08; animation: scan 2.2s linear infinite; }
    .smile   { transform-box: fill-box; transform-origin: center; animation: grin 2.4s ease-in-out infinite; }

    @keyframes bounce {
      0%, 100% { transform: scale(1, 1); }
      50%      { transform: scale(1.04, .96); }
    }
    @keyframes wigL { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
    @keyframes wigR { 0%, 100% { transform: rotate(6deg); }  50% { transform: rotate(-6deg); } }
    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      94%           { transform: scaleY(.1); }
    }
    @keyframes scan { from { transform: translateY(-8px); } to { transform: translateY(28px); } }
    @keyframes grin {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.12, 1.2); }
    }

    @media (prefers-reduced-motion: reduce) {
      .tv, .antL, .antR, .eye, .scan, .smile { animation: none; }
    }
  </style>

  <defs>
    <clipPath id="scr"><rect x="14" y="24" width="30" height="24" rx="6"/></clipPath>
  </defs>

  <g class="tv">
    <!-- antennas -->
    <g class="antL">
      <line class="limeS" x1="26" y1="19" x2="17" y2="7"/>
      <circle class="lime" cx="17" cy="7" r="3"/>
    </g>
    <g class="antR">
      <line class="limeS" x1="38" y1="19" x2="47" y2="7"/>
      <circle class="lime" cx="47" cy="7" r="3"/>
    </g>

    <!-- feet -->
    <rect class="body" x="16" y="53" width="8" height="5" rx="2.5"/>
    <rect class="body" x="40" y="53" width="8" height="5" rx="2.5"/>

    <!-- body -->
    <rect class="body" x="7" y="17" width="50" height="38" rx="10"/>
    <path class="shine" d="M12,26 Q12,20 19,20 L30,20 Q16,22 12,32 Z"/>

    <!-- screen -->
    <rect class="screen" x="14" y="24" width="30" height="24" rx="6"/>
    <g clip-path="url(#scr)">
      <rect class="scan" x="14" y="24" width="30" height="6"/>
    </g>

    <!-- face -->
    <ellipse class="lime eye" cx="23.5" cy="33" rx="2.6" ry="3.2"/>
    <ellipse class="lime eye" cx="34.5" cy="33" rx="2.6" ry="3.2"/>
    <path class="limeS smile" d="M23,39.5 Q29,45.5 35,39.5"/>

    <!-- knobs -->
    <circle class="knob" cx="50.5" cy="30" r="2.6"/>
    <circle class="knob" cx="50.5" cy="39" r="2.6"/>
    <line x1="50.5" y1="45" x2="50.5" y2="48" stroke="#fff" stroke-opacity=".6" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
