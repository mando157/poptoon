<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" width="200" height="250" role="img" aria-label="Animated popcorn box" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .box { animation: wobble 2.4s ease-in-out infinite; transform-origin: 100px 225px; }
    @keyframes wobble {
      0%, 100% { transform: rotate(-1.5deg); }
      50%      { transform: rotate(1.5deg); }
    }
    .pop {
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
      animation: pop 2.4s ease-out infinite;
    }
    @keyframes pop {
      0%   { transform: translate(0, 0) scale(.4) rotate(0deg); opacity: 0; }
      12%  { opacity: 1; }
      45%  { transform: translate(calc(var(--dx) * .6), -85px) scale(1) rotate(160deg); opacity: 1; }
      85%  { transform: translate(var(--dx), 0px) scale(1) rotate(320deg); opacity: 1; }
      100% { transform: translate(var(--dx), 6px) scale(.9) rotate(360deg); opacity: 0; }
    }
    .heap { animation: bounce 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
    @keyframes bounce {
      0%, 100% { transform: scaleY(1); }
      50%      { transform: scaleY(1.05); }
    }
    @media (prefers-reduced-motion: reduce) {
      .box, .pop, .heap { animation: none; }
      .pop { opacity: 1; }
    }
  </style>

  <defs>
    <g id="k-outline" fill="#fff3c4" stroke="#e8b830" stroke-width="3" stroke-linejoin="round">
      <circle cx="0" cy="0" r="7"/>
      <circle cx="-6" cy="4" r="6"/>
      <circle cx="6" cy="4" r="6"/>
      <circle cx="0" cy="-5" r="5"/>
    </g>
    <g id="k-fill" fill="#fff8dc">
      <circle cx="0" cy="0" r="7"/>
      <circle cx="-6" cy="4" r="6"/>
      <circle cx="6" cy="4" r="6"/>
      <circle cx="0" cy="-5" r="5"/>
    </g>
    <g id="kernel">
      <use href="#k-outline"/>
      <use href="#k-fill"/>
      <circle cx="-2" cy="-3" r="1.6" fill="#f3d37a"/>
    </g>
  </defs>

  <!-- shadow -->
  <ellipse cx="100" cy="232" rx="52" ry="6" fill="#000" opacity=".12"/>

  <g class="box">
    <!-- popcorn heap on the rim -->
    <g class="heap">
      <use href="#kernel" transform="translate(62,104)"/>
      <use href="#kernel" transform="translate(82,98)"/>
      <use href="#kernel" transform="translate(102,95)"/>
      <use href="#kernel" transform="translate(122,98)"/>
      <use href="#kernel" transform="translate(140,104)"/>
      <use href="#kernel" transform="translate(72,112)"/>
      <use href="#kernel" transform="translate(92,108)"/>
      <use href="#kernel" transform="translate(112,108)"/>
      <use href="#kernel" transform="translate(130,112)"/>
    </g>

    <!-- box body: 5 stripes -->
    <polygon points="50,115 70,115 76,225 60,225"   fill="#e53935"/>
    <polygon points="70,115 90,115 92,225 76,225"   fill="#ffffff"/>
    <polygon points="90,115 110,115 108,225 92,225" fill="#e53935"/>
    <polygon points="110,115 130,115 124,225 108,225" fill="#ffffff"/>
    <polygon points="130,115 150,115 140,225 124,225" fill="#e53935"/>
    <!-- subtle shading -->
    <polygon points="50,115 150,115 140,225 60,225" fill="none" stroke="#b71c1c" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- top rim -->
    <rect x="46" y="111" width="108" height="9" rx="4" fill="#c62828"/>

    <!-- label -->
    <rect x="76" y="148" width="48" height="26" rx="6" fill="#fff8dc" stroke="#c62828" stroke-width="2"/>
    <text x="100" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" fill="#c62828">POP!</text>
  </g>

  <!-- flying popcorn -->
  <g transform="translate(78,92)"><use class="pop" href="#kernel" style="--dx:-34px; animation-delay:0s"/></g>
  <g transform="translate(100,88)"><use class="pop" href="#kernel" style="--dx:6px; animation-delay:.5s"/></g>
  <g transform="translate(122,92)"><use class="pop" href="#kernel" style="--dx:36px; animation-delay:1s"/></g>
  <g transform="translate(90,90)"><use class="pop" href="#kernel" style="--dx:-18px; animation-delay:1.5s"/></g>
  <g transform="translate(112,90)"><use class="pop" href="#kernel" style="--dx:22px; animation-delay:2s"/></g>
</svg>
