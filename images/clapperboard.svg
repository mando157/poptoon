<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Animated movie clapperboard" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .arm {
      transform-origin: 36px 66px;
      animation: clap 2.6s ease-in-out infinite;
    }
    @keyframes clap {
      0%, 40% { transform: rotate(-26deg); }
      50%     { transform: rotate(0deg); }
      56%     { transform: rotate(-5deg); }
      62%     { transform: rotate(0deg); }
      88%     { transform: rotate(0deg); }
      100%    { transform: rotate(-26deg); }
    }
    .spark { opacity: 0; animation: spark 2.6s ease-out infinite; transform-origin: 170px 62px; }
    @keyframes spark {
      0%, 48% { opacity: 0; transform: scale(.4); }
      52%     { opacity: 1; transform: scale(1); }
      70%     { opacity: 0; transform: scale(1.4); }
      100%    { opacity: 0; }
    }
    .play {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulse 1.3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.12); }
    }
    @media (prefers-reduced-motion: reduce) {
      .arm, .spark, .play { animation: none; }
      .arm { transform: rotate(-10deg); }
    }
  </style>

  <defs>
    <clipPath id="clipFixed"><rect x="30" y="68" width="140" height="20"/></clipPath>
    <clipPath id="clipArm"><rect x="30" y="46" width="140" height="20"/></clipPath>
  </defs>

  <!-- shadow -->
  <ellipse cx="100" cy="186" rx="64" ry="6" fill="#000" opacity=".12"/>

  <!-- board body -->
  <rect x="30" y="88" width="140" height="84" rx="6" fill="#37474f"/>
  <rect x="42" y="100" width="40" height="5" rx="2.5" fill="#78909c"/>
  <rect x="118" y="100" width="40" height="5" rx="2.5" fill="#78909c"/>
  <line x1="30" y1="112" x2="170" y2="112" stroke="#546e7a" stroke-width="2"/>

  <!-- play button -->
  <g class="play">
    <circle cx="100" cy="142" r="20" fill="#ffc107"/>
    <polygon points="94,131 94,153 114,142" fill="#263238"/>
  </g>

  <!-- fixed striped bar -->
  <g clip-path="url(#clipFixed)">
    <rect x="30" y="68" width="140" height="20" fill="#ffc107"/>
    <polygon points="30,88 50,88 70,68 50,68" fill="#212121"/>
    <polygon points="70,88 90,88 110,68 90,68" fill="#212121"/>
    <polygon points="110,88 130,88 150,68 130,68" fill="#212121"/>
    <polygon points="150,88 170,88 190,68 170,68" fill="#212121"/>
  </g>

  <!-- moving clapper arm -->
  <g class="arm">
    <g clip-path="url(#clipArm)">
      <rect x="30" y="46" width="140" height="20" fill="#ffc107"/>
      <polygon points="50,66 70,66 90,46 70,46" fill="#212121"/>
      <polygon points="90,66 110,66 130,46 110,46" fill="#212121"/>
      <polygon points="130,66 150,66 170,46 150,46" fill="#212121"/>
      <polygon points="10,66 30,66 50,46 30,46" fill="#212121"/>
    </g>
    <rect x="30" y="46" width="140" height="20" rx="3" fill="none" stroke="#212121" stroke-width="2"/>
  </g>

  <!-- hinge -->
  <circle cx="36" cy="66" r="4" fill="#90a4ae" stroke="#212121" stroke-width="1.5"/>

  <!-- clap spark -->
  <g class="spark" stroke="#ffc107" stroke-width="3" stroke-linecap="round">
    <line x1="170" y1="62" x2="186" y2="50"/>
    <line x1="172" y1="68" x2="190" y2="66"/>
    <line x1="168" y1="56" x2="176" y2="40"/>
  </g>
</svg>
