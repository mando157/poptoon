<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="56" height="56" role="img" aria-label="Popcorn icon" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .teal   { fill: var(--primary-color, #14B8A6); }
    .white  { fill: #ffffff; }
    .lime   { fill: var(--accent-color, #D9FF66); }
    .ink    { stroke: var(--primary-hover, #0D9488); stroke-width: 2.6; stroke-linejoin: round; }

    .bucket { transform-origin: 32px 61px; animation: wobble 2.2s ease-in-out infinite; }
    .heap   { transform-box: fill-box; transform-origin: center bottom; animation: puff 1.1s ease-in-out infinite; }
    .pop    { transform-box: fill-box; transform-origin: center; opacity: 0; animation: pop 2.2s ease-out infinite; }

    @keyframes wobble { 0%, 100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg); } }
    @keyframes puff   { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.06); } }
    @keyframes pop {
      0%   { transform: translate(0, 0) scale(.4) rotate(0deg); opacity: 0; }
      12%  { opacity: 1; }
      45%  { transform: translate(calc(var(--dx) * .6), -13px) scale(1) rotate(160deg); opacity: 1; }
      85%  { transform: translate(var(--dx), 2px) scale(1) rotate(320deg); opacity: 1; }
      100% { transform: translate(var(--dx), 4px) scale(.9) rotate(360deg); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .bucket, .heap, .pop { animation: none; }
      .pop { opacity: 1; }
    }
  </style>

  <defs>
    <g id="k-out" fill="#fff3c4" stroke="#c98a00" stroke-width="2.2" stroke-linejoin="round">
      <circle cx="0" cy="0" r="4.6"/>
      <circle cx="-4" cy="2.6" r="4"/>
      <circle cx="4" cy="2.6" r="4"/>
      <circle cx="0" cy="-3.2" r="3.4"/>
    </g>
    <g id="k-in" fill="#fff8dc">
      <circle cx="0" cy="0" r="4.6"/>
      <circle cx="-4" cy="2.6" r="4"/>
      <circle cx="4" cy="2.6" r="4"/>
      <circle cx="0" cy="-3.2" r="3.4"/>
    </g>
    <g id="kernel"><use href="#k-out"/><use href="#k-in"/></g>
  </defs>

  <g class="bucket">

    <!-- striped body -->
    <polygon class="teal"  points="11,33 22,33 24,61 16,61"/>
    <polygon class="white" points="22,33 32,33 32,61 24,61"/>
    <polygon class="teal"  points="32,33 42,33 40,61 32,61"/>
    <polygon class="white" points="42,33 53,33 48,61 40,61"/>
    <polygon class="ink" fill="none" points="11,33 53,33 48,61 16,61"/>

    <!-- popcorn heap -->
    <g class="heap">
      <use href="#kernel" transform="translate(17,30) scale(1.3)"/>
      <use href="#kernel" transform="translate(32,25) scale(1.4)"/>
      <use href="#kernel" transform="translate(47,30) scale(1.3)"/>
      <use href="#kernel" transform="translate(24.5,33) scale(1.2)"/>
      <use href="#kernel" transform="translate(39.5,33) scale(1.2)"/>
    </g>

    <!-- rim -->
    <rect class="lime ink" x="8" y="32" width="48" height="8" rx="4"/>

    <!-- label -->
    <circle class="lime ink" cx="32" cy="50" r="5.5"/>
    <polygon points="30.4,47.4 30.4,52.6 35,50" fill="#0F2B27"/>
  </g>

  <!-- flying kernels -->
  <g transform="translate(22,18)"><use class="pop" href="#kernel" style="--dx:-9px; animation-delay:0s"/></g>
  <g transform="translate(33,16)"><use class="pop" href="#kernel" style="--dx:2px; animation-delay:.73s"/></g>
  <g transform="translate(43,18)"><use class="pop" href="#kernel" style="--dx:10px; animation-delay:1.46s"/></g>
</svg>
