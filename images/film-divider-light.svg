<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="18" role="img" aria-label="Divider" style="display:block" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .line  { stroke: #6B7A73; stroke-width: 1.6; opacity: .5; fill: none; }
    .holes { stroke: #6B7A73; stroke-width: 8; fill: none; stroke-dasharray: 7 11; opacity: .32; animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -18; } }
    @media (prefers-reduced-motion: reduce) { .holes { animation: none; } }
  </style>

  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#fff" stop-opacity="0"/>
      <stop offset=".25" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".75" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1"   stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="edgeFade" maskUnits="userSpaceOnUse" x="0" y="0" width="100%" height="18">
      <rect x="0" y="0" width="100%" height="18" fill="url(#fade)"/>
    </mask>
  </defs>

  <g mask="url(#edgeFade)">
    <line class="line" x1="0" y1="0.8"  x2="100%" y2="0.8"/>
    <line class="line" x1="0" y1="17.2" x2="100%" y2="17.2"/>
    <line class="holes" x1="0" y1="9" x2="100%" y2="9"/>
  </g>
</svg>
